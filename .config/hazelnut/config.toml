[general]
log_level = "info"
debounce_seconds = 2
polling_interval_secs = 5
log_retention = 1000
start_daemon_on_launch = false
notifications_enabled = false

[[watch]]
path = "/home/pedrojunior/Downloads"
recursive = false
rules = ["daily_cleaner"]

[[watch]]
path = "/home/pedrojunior/.trash"
recursive = false
rules = ["7Days_cleaner"]

[[rule]]
name = "daily_cleaner"
enabled = true
stop_processing = false

[rule.condition]
extensions = []
age_days_greater_than = 1

[rule.action]
type = "move"
destination = "~/.trash"
create_destination = true
overwrite = false

[[rule]]
name = "7Days_cleaner"
enabled = true
stop_processing = false

[rule.condition]
extensions = []
age_days_greater_than = 7

[rule.action]
type = "delete"
